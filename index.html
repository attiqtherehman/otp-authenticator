<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Authenticator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128272;</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background:#0f1115; color:#e6e9ef; font-family:'Segoe UI',system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { font-size:18px; font-weight:600; letter-spacing:.5px; color:#9aa4b2; margin-bottom:16px; }
  #page { width:100%; max-width:540px; }
  .card { position:relative; background:#181c23; border:1px solid #262c36; border-radius:12px;
          padding:14px 18px; cursor:pointer; transition:border-color .15s, transform .05s; }
  .card:hover { border-color:#3a4553; }
  .card:active { transform:scale(.99); }
  .code { font-family:Consolas,monospace; font-size:30px; font-weight:700;
          letter-spacing:6px; color:#dfe5ee; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:#8b93a1; }
  .email { color:#b6bfcc; }
  .card.copied::after { content:'Copied \2713'; position:absolute; inset:0;
          display:flex; align-items:center; justify-content:center;
          background:rgba(15,17,21,.88); border-radius:12px;
          color:#57c98a; font-size:20px; font-weight:600; }
  .btn { background:#181c23; border:1px solid #262c36; color:#b6bfcc; border-radius:8px;
         padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn:hover { border-color:#3a4553; }
  .btn.primary { border-color:#2f6fb3; color:#6db3ff; }
  #authBar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .panel { background:#10141a; border:1px solid #262c36; border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .prow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .prow input { flex:1; min-width:180px; }
  input[type=text], input[type=password] { background:#181c23; border:1px solid #262c36; color:#e6e9ef;
         border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  .ltitle { font-size:14px; color:#b6bfcc; margin-bottom:6px; }
  .hint { font-size:12px; color:#5c6572; }
  #authMsg { font-size:12px; margin:0 0 10px; min-height:16px; color:#8b93a1; }
  #authMsg.err { color:#ff6b6b; }
  #authMsg.ok { color:#57c98a; }
  #alist { display:flex; flex-direction:column; gap:10px; }
  .icoBtn { position:absolute; top:10px; background:none; border:0; color:#5c6572;
         font-size:14px; cursor:pointer; padding:2px 5px; }
  .icoBtn:hover { color:#e6e9ef; }
  .abar { height:3px; background:#262c36; border-radius:2px; margin-top:10px; overflow:hidden; }
  .abar i { display:block; height:100%; background:#57c98a; transition:width .4s linear; }
  .abar.low i { background:#e05b5b; }
  #scanVideo { width:100%; max-height:220px; object-fit:contain; background:#000;
         border:1px solid #262c36; border-radius:10px; margin:6px 0; }
  #modal { position:fixed; inset:0; background:rgba(15,17,21,.78); display:flex;
         align-items:center; justify-content:center; z-index:20; }
  #modal[hidden] { display:none; }
  .mbox { background:#181c23; border:1px solid #3a4553; border-radius:12px; padding:18px;
         width:min(92vw, 360px); display:flex; flex-direction:column; gap:10px; }
  .mbox input { width:100%; }
  .mrow { display:flex; gap:8px; justify-content:flex-end; }
  #camOverlay { position:fixed; inset:0; background:#000; z-index:30; display:flex;
         align-items:center; justify-content:center; }
  #camOverlay[hidden] { display:none; }
  #camVideo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #camFrame { position:relative; width:min(70vw, 55vh); aspect-ratio:1/1;
         border:3px solid rgba(255,255,255,.9); border-radius:18px;
         box-shadow:0 0 0 200vmax rgba(0,0,0,.45); }
  #camClose { position:absolute; top:14px; right:14px; z-index:2; background:rgba(15,17,21,.6);
         border:0; color:#fff; font-size:20px; width:42px; height:42px; border-radius:50%; cursor:pointer; }
  #camHint { position:absolute; bottom:92px; left:0; right:0; text-align:center;
         color:rgba(255,255,255,.9); font-size:14px; text-shadow:0 1px 4px #000; z-index:2; }
  #camZoomRow { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:2;
         width:min(70vw, 320px); display:flex; gap:10px; align-items:center; }
  #camZoomRow[hidden] { display:none; }
  #camZoomRow input[type=range] { flex:1; accent-color:#6db3ff; }
  #camZoomRow .czoom { color:#fff; font-size:13px; text-shadow:0 1px 4px #000; min-width:22px; }
</style>
</head>
<body>
<h1>AUTHENTICATOR</h1>
<div id="page">
  <div id="lock" class="panel">
    <div id="lockTitle" class="ltitle"></div>
    <div class="prow">
      <input type="password" id="passIn" placeholder="Passphrase">
      <input type="password" id="passIn2" placeholder="Confirm passphrase" hidden>
      <button class="btn primary" id="btnUnlock">Unlock</button>
    </div>
    <div id="lockMsg" class="hint"></div>
  </div>
  <div id="authMain" style="display:none">
    <div id="authBar">
      <button class="btn primary" id="btnAdd">+ Add</button>
      <button class="btn" id="btnExport">Export</button>
      <button class="btn" id="btnImport">Import</button>
      <button class="btn" id="btnChangePass">Passphrase</button>
      <button class="btn" id="btnLock">Lock</button>
    </div>
    <div id="addPanel" class="panel" hidden>
      <div class="prow">
        <button class="btn" id="btnUpload">Upload QR image</button>
        <button class="btn" id="btnScan">Scan screen</button>
        <button class="btn" id="btnCam">Camera</button>
      </div>
      <div class="prow"><span class="hint">...or snip the QR with Win+Shift+S and press Ctrl+V here</span></div>
      <video id="scanVideo" hidden muted playsinline></video>
      <div class="prow">
        <input type="text" id="manualIn" placeholder="Base32 secret, otpauth:// or otpauth-migration:// URI">
      </div>
      <div class="prow">
        <input type="text" id="manualName" placeholder="Label for bare secret (Issuer:account)">
        <button class="btn primary" id="btnManualAdd">Add account</button>
      </div>
    </div>
    <div id="authMsg"></div>
    <div id="alist"></div>
  </div>
</div>
<div id="camOverlay" hidden>
  <video id="camVideo" muted playsinline></video>
  <button id="camClose" title="Close">&#10005;</button>
  <div id="camFrame"></div>
  <div id="camHint">Point at the QR code</div>
  <div id="camZoomRow" hidden>
    <span class="czoom">Zoom</span>
    <input type="range" id="zoomCtl">
    <span class="czoom" id="zoomVal"></span>
  </div>
</div>
<div id="modal" hidden>
  <div class="mbox">
    <div class="ltitle" id="mTitle"></div>
    <input type="password" id="mIn1" placeholder="Passphrase" autocomplete="off">
    <input type="password" id="mIn2" placeholder="Confirm passphrase" autocomplete="off" hidden>
    <div class="mrow">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mOk">OK</button>
    </div>
  </div>
</div>
<input type="file" id="qrFile" accept="image/*" hidden>
<input type="file" id="impFile" accept="application/json,.json" hidden>
<script src="jsqr.js"></script>
<script src="zxing.js"></script>
<script>
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtCode(c) { return c.length === 8 ? c.slice(0, 4) + ' ' + c.slice(4) : c.length === 6 ? c.slice(0, 3) + ' ' + c.slice(3) : c; }
function copy(code, el) {
  const done = () => { el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 800); };
  const fallback = () => {
    const t = document.createElement('textarea');
    t.value = code; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove(); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(code).then(done).catch(fallback);
  else fallback();
}

/* ---------- vault (PBKDF2 + AES-GCM, localStorage) ---------- */
const VKEY = 'otpVault';
let vaultKey = null, vaultMeta = null, accounts = [];

const b64 = {
  enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); },
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};

async function deriveKey(pass, salt, iter) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, km,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealVault(key, meta, data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key,
    new TextEncoder().encode(JSON.stringify(data))));
  return { v: 1, app: 'otp-authenticator', kdf: { salt: b64.enc(meta.salt), iter: meta.iter }, iv: b64.enc(iv), ct: b64.enc(ct) };
}
async function openVault(env, pass) {
  const salt = b64.dec(env.kdf.salt), iter = env.kdf.iter;
  const key = await deriveKey(pass, salt, iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(env.iv) }, key, b64.dec(env.ct));
  return { key: key, meta: { salt: salt, iter: iter }, data: JSON.parse(new TextDecoder().decode(pt)) };
}
async function saveVault() {
  if (!vaultKey) return;
  localStorage.setItem(VKEY, JSON.stringify(await sealVault(vaultKey, vaultMeta, accounts)));
}

function initLock() {
  const has = !!localStorage.getItem(VKEY);
  $('lockTitle').textContent = has ? 'Enter your passphrase to unlock the accounts' : 'Create a passphrase to protect your accounts';
  $('passIn2').hidden = has;
  $('btnUnlock').textContent = has ? 'Unlock' : 'Create';
  $('lockMsg').textContent = '';
}
async function unlock() {
  const p = $('passIn').value;
  if (!p) { $('lockMsg').textContent = 'Enter a passphrase'; return; }
  const raw = localStorage.getItem(VKEY);
  try {
    if (raw) {
      const r = await openVault(JSON.parse(raw), p);
      vaultKey = r.key; vaultMeta = r.meta; accounts = r.data;
    } else {
      if (p !== $('passIn2').value) { $('lockMsg').textContent = 'Passphrases do not match'; return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      vaultMeta = { salt: salt, iter: 310000 };
      vaultKey = await deriveKey(p, salt, 310000);
      accounts = [];
      await saveVault();
    }
    $('passIn').value = ''; $('passIn2').value = '';
    $('lock').style.display = 'none'; $('authMain').style.display = 'block';
    renderAccounts(); startAuthTimer();
  } catch (e) { $('lockMsg').textContent = 'Wrong passphrase'; }
}
function lockNow() {
  vaultKey = null; vaultMeta = null; accounts = [];
  stopAuthTimer(); stopScan();
  $('alist').innerHTML = ''; $('authMain').style.display = 'none';
  $('lock').style.display = 'block'; initLock();
}

/* ---------- TOTP / HOTP engine (RFC 4226 / 6238) ---------- */
const B32A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Decode(s) {
  s = s.toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = 0, val = 0; const out = [];
  for (const c of s) {
    val = (val << 5) | B32A.indexOf(c); bits += 5;
    if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
  }
  return new Uint8Array(out);
}
function base32Encode(u8) {
  let bits = 0, val = 0, out = '';
  for (const b of u8) {
    val = (val << 8) | b; bits += 8;
    while (bits >= 5) { out += B32A[(val >>> (bits - 5)) & 31]; bits -= 5; }
  }
  if (bits) out += B32A[(val << (5 - bits)) & 31];
  return out;
}
async function hmac(algo, keyBytes, msg) {
  const k = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: algo }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, msg));
}
async function hotp(secretB32, counter, digits, algo) {
  const msg = new Uint8Array(8);
  let c = counter;
  for (let i = 7; i >= 0; i--) { msg[i] = c % 256; c = Math.floor(c / 256); }
  const h = await hmac(algo || 'SHA-1', base32Decode(secretB32), msg);
  const o = h[h.length - 1] & 15;
  const code = (((h[o] & 127) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % Math.pow(10, digits || 6);
  return String(code).padStart(digits || 6, '0');
}
function totpCounter(period) { return Math.floor(Date.now() / 1000 / (period || 30)); }
function totp(a) { return hotp(a.secret, totpCounter(a.period), a.digits, a.algo); }

/* startup self-test against RFC 4226 / 6238 vectors */
(async () => {
  try {
    const S = 'GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ';
    const ok = (await hotp(S, 0, 6, 'SHA-1')) === '755224' &&
               (await hotp(S, 1, 6, 'SHA-1')) === '287082' &&
               (await hotp(S, 1, 8, 'SHA-1')) === '94287082';
    console[ok ? 'log' : 'error']('OTP engine self-test ' + (ok ? 'passed' : 'FAILED'));
  } catch (e) { console.error('OTP self-test error', e); }
})();

/* ---------- otpauth:// parser ---------- */
function normAcc(a) {
  return {
    type: a.type === 'hotp' ? 'hotp' : 'totp',
    issuer: a.issuer || '', name: a.name || 'account',
    secret: String(a.secret || '').replace(/[^A-Za-z2-7]/g, '').toUpperCase(),
    algo: a.algo || 'SHA-1', digits: a.digits || 6, period: a.period || 30, counter: a.counter || 0
  };
}
function parseOtpauth(uri) {
  const u = new URL(uri);
  const label = decodeURIComponent(u.pathname.replace(/^\/+/, ''));
  let issuer = u.searchParams.get('issuer') || '', name = label;
  if (label.includes(':')) {
    const i = label.indexOf(':');
    if (!issuer) issuer = label.slice(0, i);
    name = label.slice(i + 1).trim();
  }
  const secret = u.searchParams.get('secret') || '';
  if (!secret) throw new Error('URI has no secret');
  const algoDigits = (u.searchParams.get('algorithm') || 'SHA1').replace(/[^0-9]/g, '') || '1';
  return normAcc({
    type: u.host, issuer: issuer, name: name, secret: secret,
    algo: 'SHA-' + algoDigits,
    digits: parseInt(u.searchParams.get('digits')) || 6,
    period: parseInt(u.searchParams.get('period')) || 30,
    counter: parseInt(u.searchParams.get('counter')) || 0
  });
}

/* ---------- Google Authenticator transfer QR (otpauth-migration://) ---------- */
function parseMigration(uri) {
  const u = new URL(uri);
  let s = u.searchParams.get('data');
  if (!s) throw new Error('no data in migration URI');
  s = s.replace(/-/g, '+').replace(/_/g, '/').replace(/ /g, '+');
  while (s.length % 4) s += '=';
  const bytes = b64.dec(s);
  const accs = []; let p = 0;
  function varint() { let r = 0, sh = 0; for (;;) { const b = bytes[p++]; r += (b & 127) * Math.pow(2, sh); sh += 7; if (!(b & 128)) return r; } }
  function skip(wt) { if (wt === 0) varint(); else if (wt === 2) { p += varint(); } else if (wt === 5) p += 4; else if (wt === 1) p += 8; }
  while (p < bytes.length) {
    const tag = varint(), field = tag >>> 3, wt = tag & 7;
    if (field === 1 && wt === 2) {
      const end = p + varint();
      const acc = { type: 'totp', issuer: '', name: 'account', secret: '', algo: 'SHA-1', digits: 6, period: 30, counter: 0 };
      while (p < end) {
        const t2 = varint(), f2 = t2 >>> 3, w2 = t2 & 7;
        if (f2 === 1 && w2 === 2) { const l = varint(); acc.secret = base32Encode(bytes.slice(p, p + l)); p += l; }
        else if (f2 === 2 && w2 === 2) { const l = varint(); acc.name = new TextDecoder().decode(bytes.slice(p, p + l)); p += l; }
        else if (f2 === 3 && w2 === 2) { const l = varint(); acc.issuer = new TextDecoder().decode(bytes.slice(p, p + l)); p += l; }
        else if (f2 === 4 && w2 === 0) { const a = varint(); acc.algo = a === 2 ? 'SHA-256' : a === 3 ? 'SHA-512' : 'SHA-1'; }
        else if (f2 === 5 && w2 === 0) { acc.digits = varint() === 2 ? 8 : 6; }
        else if (f2 === 6 && w2 === 0) { acc.type = varint() === 1 ? 'hotp' : 'totp'; }
        else if (f2 === 7 && w2 === 0) { acc.counter = varint(); }
        else skip(w2);
      }
      if (acc.secret) accs.push(normAcc(acc));
    } else skip(wt);
  }
  if (!accs.length) throw new Error('no accounts in transfer payload');
  return accs;
}

/* ---------- add / render / tick ---------- */
function authNote(msg, cls) {
  const el = $('authMsg');
  el.textContent = msg || ''; el.className = cls || '';
  if (msg && cls === 'ok') setTimeout(() => { if (el.textContent === msg) { el.textContent = ''; el.className = ''; } }, 6000);
}
function accLabel(a) { return (a.issuer ? a.issuer + ' - ' : '') + a.name; }

function addAccounts(list, source) {
  let added = 0, dup = 0;
  for (const a of list) {
    if (!a.secret) continue;
    if (accounts.some(x => x.secret === a.secret && x.name === a.name && x.issuer === a.issuer)) { dup++; continue; }
    accounts.push(a); added++;
  }
  if (added) { saveVault(); renderAccounts(); }
  authNote(source + ': added ' + added + (dup ? ', skipped ' + dup + ' duplicate(s)' : ''), added ? 'ok' : 'err');
}

function cardHtml(a, i, code) {
  return '<div class="card acard" data-idx="' + i + '" data-type="' + a.type + '" data-counter="" data-code="' + esc(code) + '">' +
    '<button class="icoBtn ren" style="right:34px" title="Rename">&#9998;</button>' +
    '<button class="icoBtn del" style="right:8px" title="Delete">&#10005;</button>' +
    '<div class="meta" style="margin:0 0 4px"><span class="email">' + esc(accLabel(a)) + '</span></div>' +
    '<div class="code acode">' + fmtCode(code) + '</div>' +
    (a.type === 'totp'
      ? '<div class="abar"><i style="width:100%"></i></div>'
      : '<div class="meta" style="margin-top:8px"><button class="btn nextc">Next code</button><span class="hint hcnt">counter ' + a.counter + '</span></div>') +
    '</div>';
}
async function renderAccounts() {
  const el = $('alist');
  if (!accounts.length) {
    el.innerHTML = '<div class="hint" style="padding:20px;text-align:center">No accounts yet - click + Add to enroll one</div>';
    return;
  }
  const parts = [];
  for (let i = 0; i < accounts.length; i++) {
    const a = accounts[i];
    const code = a.type === 'hotp' ? await hotp(a.secret, a.counter, a.digits, a.algo) : await totp(a);
    parts.push(cardHtml(a, i, code));
  }
  el.innerHTML = parts.join('');
}

let authTimer = null;
function startAuthTimer() { stopAuthTimer(); authTimer = setInterval(authTick, 500); authTick(); }
function stopAuthTimer() { if (authTimer) { clearInterval(authTimer); authTimer = null; } }
function authTick() {
  const now = Date.now() / 1000;
  document.querySelectorAll('.acard[data-type=totp]').forEach(card => {
    const a = accounts[+card.dataset.idx]; if (!a) return;
    const period = a.period || 30, rem = period - (now % period);
    card.querySelector('.abar i').style.width = (rem / period * 100) + '%';
    card.querySelector('.abar').classList.toggle('low', rem < 6);
    const c = Math.floor(now / period);
    if (+card.dataset.counter !== c) {
      card.dataset.counter = c;
      totp(a).then(code => { card.querySelector('.acode').textContent = fmtCode(code); card.dataset.code = code; });
    }
  });
}

/* ---------- QR input: paste / upload / screen scan ---------- */
function handleDecoded(text, source) {
  try {
    if (/^otpauth-migration:/i.test(text)) addAccounts(parseMigration(text), source);
    else if (/^otpauth:/i.test(text)) addAccounts([parseOtpauth(text)], source);
    else authNote('A QR was found but it is not an otpauth QR', 'err');
  } catch (e) { authNote('Could not read the QR: ' + e.message, 'err'); }
}
function grabDecode(src, scale, pad, binarize) {
  const w0 = src.videoWidth || src.naturalWidth || src.width;
  const h0 = src.videoHeight || src.naturalHeight || src.height;
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas');
  c.width = w + pad * 2; c.height = h + pad * 2;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = scale <= 1;
  ctx.drawImage(src, pad, pad, w, h);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  if (binarize) {
    /* hard black/white threshold at the mean - recovers anti-aliased QRs */
    const px = d.data; let sum = 0;
    for (let i = 0; i < px.length; i += 4) sum += (px[i] * 3 + px[i + 1] * 4 + px[i + 2]) >> 3;
    const th = sum / (px.length / 4);
    for (let i = 0; i < px.length; i += 4) {
      const v = ((px[i] * 3 + px[i + 1] * 4 + px[i + 2]) >> 3) < th ? 0 : 255;
      px[i] = px[i + 1] = px[i + 2] = v;
    }
  }
  return jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
}
async function zxTry(src, scale) {
  const w0 = src.videoWidth || src.naturalWidth || src.width;
  const h0 = src.videoHeight || src.naturalHeight || src.height;
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);
  const results = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, w, h),
    { formats: ['QRCode'], tryHarder: true, maxNumberOfSymbols: 1 });
  return (results.length && results[0].isValid) ? { data: results[0].text } : null;
}
function haveDecoder() { return typeof ZXingWASM !== 'undefined' || typeof jsQR === 'function'; }
async function decodeImage(src, quick) {
  const w = src.videoWidth || src.naturalWidth || src.width;
  const h = src.videoHeight || src.naturalHeight || src.height;
  if (!w || !h) return null;
  /* primary engine: ZXing (WASM) - handles dense, small, blurry QRs */
  if (typeof ZXingWASM !== 'undefined') {
    try {
      const r = await zxTry(src, 1);
      if (r) return r;
      if (!quick && w < 700) { const r2 = await zxTry(src, 2); if (r2) return r2; }
    } catch (e) {}
  }
  /* fallback engine: jsQR */
  if (typeof jsQR !== 'function') return null;
  if (quick) {
    try { return grabDecode(src, w > 1280 ? 1280 / w : 1, 0); } catch (e) { return null; }
  }
  const attempts = [[1, false]];
  if (w > 900) attempts.push([900 / w, false]);
  if (w < 900) attempts.push([2, false], [2, true], [3, false], [3, true]);
  if (w < 250) attempts.push([4, false], [4, true]);
  for (const [s, bin] of attempts) {
    try {
      const r = grabDecode(src, s, Math.max(12, Math.round(w * s * 0.06)), bin);
      if (r && r.data) return r;
    } catch (e) {}
  }
  return null;
}
function fileToQr(file, source) {
  if (!haveDecoder()) return authNote('zxing.js / jsqr.js missing next to index.html - QR scanning unavailable', 'err');
  const img = new Image();
  img.onload = async () => {
    authNote('Decoding...');
    const r = await decodeImage(img); URL.revokeObjectURL(img.src);
    if (r && r.data) handleDecoded(r.data, source);
    else authNote('No QR code found in the image (' + img.naturalWidth + 'x' + img.naturalHeight + 'px). Try snipping the whole QR with a little margin around it.', 'err');
  };
  img.src = URL.createObjectURL(file);
}
document.addEventListener('paste', e => {
  if (!vaultKey) return;
  for (const it of e.clipboardData.items) {
    if (it.type.startsWith('image/')) { fileToQr(it.getAsFile(), 'pasted image'); e.preventDefault(); return; }
  }
});

let scanStream = null, scanInt = null, scanBtn = null;
async function startScan(kind) {
  if (!haveDecoder()) return authNote('zxing.js / jsqr.js missing - QR scanning unavailable', 'err');
  stopScan();
  try {
    scanStream = kind === 'screen'
      ? await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: 'monitor' }, audio: false,
          selfBrowserSurface: 'exclude', surfaceSwitching: 'include'
        })
      : await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
        });
  } catch (e) {
    return authNote(kind === 'screen' ? 'Screen scan cancelled' : 'Camera unavailable or permission denied', 'err');
  }
  scanBtn = $(kind === 'screen' ? 'btnScan' : 'btnCam');
  scanBtn.textContent = 'Stop';
  const cam = kind === 'camera';
  const v = $(cam ? 'camVideo' : 'scanVideo');
  v.srcObject = scanStream;
  if (cam) { $('camHint').textContent = 'Point at the QR code'; $('camOverlay').hidden = false; }
  else v.hidden = false;
  await v.play();
  const label = cam ? 'camera scan' : 'screen scan';
  const note = cam ? (m => { $('camHint').textContent = m; }) : authNote;
  if (!cam) authNote('Watching the shared screen (preview below) - now open the page with the QR. It is grabbed automatically.');
  if (cam) {
    /* start at 2x zoom and offer a slider, where the camera supports it */
    try {
      const track = scanStream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom && caps.zoom.max > caps.zoom.min) {
        const z = $('zoomCtl');
        z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
        const initial = Math.max(caps.zoom.min, Math.min(2, caps.zoom.max));
        z.value = initial;
        $('zoomVal').textContent = (+initial).toFixed(1) + 'x';
        track.applyConstraints({ advanced: [{ zoom: initial }] }).catch(function () {});
        z.oninput = () => {
          $('zoomVal').textContent = (+z.value).toFixed(1) + 'x';
          track.applyConstraints({ advanced: [{ zoom: +z.value }] }).catch(function () {});
        };
        $('camZoomRow').hidden = false;
      }
    } catch (e) {}
  }
  let tries = 0, busy = false;
  scanInt = setInterval(async () => {
    const w = v.videoWidth, h = v.videoHeight;
    tries++;
    if (!w) {
      if (tries % 6 === 0) note('Waiting for video frames...');
      return;
    }
    if (busy) return;
    busy = true;
    let r = null;
    try { r = await decodeImage(v, true); } catch (e) {}
    busy = false;
    if (!scanInt) return;
    if (r && r.data) { stopScan(); handleDecoded(r.data, label); return; }
    if (tries % 6 === 0) note(cam
      ? 'No QR yet - hold the code steady inside the frame'
      : 'Scanning ' + w + 'x' + h + ', ' + tries + ' passes - no QR yet. Bring the QR fully into view.');
  }, 350);
  scanStream.getVideoTracks()[0].onended = stopScan;
}
function stopScan() {
  if (scanInt) { clearInterval(scanInt); scanInt = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('scanVideo').srcObject = null; $('scanVideo').hidden = true;
  $('camVideo').srcObject = null;
  $('camOverlay').hidden = true;
  $('camZoomRow').hidden = true;
  if (scanBtn) { scanBtn.textContent = scanBtn.id === 'btnScan' ? 'Scan screen' : 'Camera'; scanBtn = null; }
}

/* ---------- masked passphrase dialog (replaces prompt) ---------- */
function askPass(title, withConfirm) {
  return new Promise(resolve => {
    $('mTitle').textContent = title;
    $('mIn1').value = ''; $('mIn2').value = '';
    $('mIn2').hidden = !withConfirm;
    $('modal').hidden = false;
    $('mIn1').focus();
    const done = val => {
      $('modal').hidden = true;
      $('mOk').onclick = $('mCancel').onclick = $('mIn1').onkeydown = $('mIn2').onkeydown = null;
      resolve(val);
    };
    const ok = () => {
      const p = $('mIn1').value;
      if (!p) return;
      if (withConfirm && p !== $('mIn2').value) { $('mTitle').textContent = title + ' - passphrases do not match'; return; }
      done(p);
    };
    const key = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') done(null); };
    $('mOk').onclick = ok;
    $('mCancel').onclick = () => done(null);
    $('mIn1').onkeydown = key; $('mIn2').onkeydown = key;
  });
}

function manualAdd() {
  const t = $('manualIn').value.trim();
  if (!t) return authNote('Enter a secret or an otpauth URI', 'err');
  try {
    if (/^otpauth-migration:/i.test(t)) addAccounts(parseMigration(t), 'manual entry');
    else if (/^otpauth:/i.test(t)) addAccounts([parseOtpauth(t)], 'manual entry');
    else {
      const secret = t.replace(/[\s=]/g, '').toUpperCase();
      if (!/^[A-Z2-7]{8,}$/.test(secret)) return authNote('Not a valid Base32 secret or otpauth URI', 'err');
      const label = $('manualName').value.trim() || 'account';
      let issuer = '', name = label;
      if (label.includes(':')) { const i = label.indexOf(':'); issuer = label.slice(0, i); name = label.slice(i + 1).trim(); }
      addAccounts([normAcc({ issuer: issuer, name: name, secret: secret })], 'manual entry');
    }
    $('manualIn').value = ''; $('manualName').value = '';
  } catch (e) { authNote('Could not add: ' + e.message, 'err'); }
}

/* ---------- export / import / passphrase ---------- */
async function exportVault() {
  if (!accounts.length) return authNote('Nothing to export yet', 'err');
  const env = await sealVault(vaultKey, vaultMeta, accounts);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(env, null, 1)], { type: 'application/json' }));
  a.download = 'otp-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  authNote('Exported ' + accounts.length + ' account(s), encrypted with your passphrase', 'ok');
}
async function importFile(file) {
  try {
    const obj = JSON.parse(await file.text());
    if (Array.isArray(obj)) return addAccounts(obj.map(normAcc), 'import');
    if (!(obj.ct && obj.kdf)) throw new Error('unrecognized file format');
    if (obj.kdf.salt === b64.enc(vaultMeta.salt)) {
      try {
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(obj.iv) }, vaultKey, b64.dec(obj.ct));
        return addAccounts(JSON.parse(new TextDecoder().decode(pt)).map(normAcc), 'import');
      } catch (e) { /* different passphrase - fall through to prompt */ }
    }
    const pass = await askPass('Passphrase for this backup file');
    if (!pass) return;
    const r = await openVault(obj, pass);
    addAccounts(r.data.map(normAcc), 'import');
  } catch (e) { authNote('Import failed: ' + (e.message || 'wrong passphrase'), 'err'); }
}
async function changePass() {
  const p1 = await askPass('Set a new passphrase', true);
  if (!p1) return;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  vaultMeta = { salt: salt, iter: 310000 };
  vaultKey = await deriveKey(p1, salt, 310000);
  await saveVault();
  authNote('Passphrase changed', 'ok');
}

/* ---------- wiring ---------- */
$('btnUnlock').onclick = unlock;
$('passIn').onkeydown = $('passIn2').onkeydown = e => { if (e.key === 'Enter') unlock(); };
$('btnAdd').onclick = () => { $('addPanel').hidden = !$('addPanel').hidden; };
$('btnUpload').onclick = () => $('qrFile').click();
$('qrFile').onchange = () => { if ($('qrFile').files[0]) fileToQr($('qrFile').files[0], 'uploaded image'); $('qrFile').value = ''; };
$('btnScan').onclick = () => { if (scanInt && scanBtn && scanBtn.id === 'btnScan') stopScan(); else startScan('screen'); };
$('btnCam').onclick = () => { if (scanInt && scanBtn && scanBtn.id === 'btnCam') stopScan(); else startScan('camera'); };
$('camClose').onclick = stopScan;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('camOverlay').hidden) stopScan(); });
$('btnManualAdd').onclick = manualAdd;
$('manualIn').onkeydown = e => { if (e.key === 'Enter') manualAdd(); };
$('btnExport').onclick = exportVault;
$('btnImport').onclick = () => $('impFile').click();
$('impFile').onchange = () => { if ($('impFile').files[0]) importFile($('impFile').files[0]); $('impFile').value = ''; };
$('btnChangePass').onclick = changePass;
$('btnLock').onclick = lockNow;

$('alist').onclick = e => {
  const card = e.target.closest('.acard'); if (!card) return;
  const i = +card.dataset.idx, a = accounts[i]; if (!a) return;
  if (e.target.classList.contains('del')) {
    if (confirm('Delete ' + accLabel(a) + '?')) { accounts.splice(i, 1); saveVault(); renderAccounts(); }
    return;
  }
  if (e.target.classList.contains('ren')) {
    const n = prompt('Account label:', a.name);
    if (n) { a.name = n; saveVault(); renderAccounts(); }
    return;
  }
  if (e.target.classList.contains('nextc')) {
    a.counter++; saveVault();
    hotp(a.secret, a.counter, a.digits, a.algo).then(code => {
      card.querySelector('.acode').textContent = fmtCode(code);
      card.dataset.code = code;
      card.querySelector('.hcnt').textContent = 'counter ' + a.counter;
    });
    return;
  }
  copy(card.dataset.code, card);
};

/* hide capture buttons that this device cannot do */
if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) $('btnScan').hidden = true;
if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) $('btnCam').hidden = true;

/* PWA service worker (not available on file://) */
if ('serviceWorker' in navigator && location.protocol !== 'file:')
  navigator.serviceWorker.register('./sw.js').catch(function () {});

initLock();
$('passIn').focus();
</script>
